name: HavenAgentD CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out HavenAgentD
        uses: actions/checkout@v4
        with:
          path: HavenAgentD

      - name: Check out CellProtocol at the manifest revision
        uses: actions/checkout@v4
        with:
          repository: Digipomps/CellProtocol
          ref: 33bc79fbead935c982a42a888673b5602c33b0d1
          path: CellProtocol

      - name: Check out Sprout at the manifest revision
        uses: actions/checkout@v4
        with:
          repository: Digipomps/Sprout
          ref: d53d2d18f5cadd4bd0e73e449101a3b766f65af7
          path: sprout
          token: ${{ secrets.HAVEN_REPO_READ_TOKEN || github.token }}

      - name: Report Swift toolchain
        run: swift --version

      - name: Test and smoke-check HavenAgentD
        working-directory: HavenAgentD
        env:
          HAVEN_CELL_PROTOCOL_PATH: ${{ github.workspace }}/CellProtocol
          HAVEN_SPROUT_PATH: ${{ github.workspace }}/sprout
        run: ./Scripts/test_haven_agentd.sh
